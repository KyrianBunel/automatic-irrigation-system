<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Arrosage – connexion</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Arrosage">
  <meta name="theme-color" content="#EEF2EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111915" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="{{ url_for('manifeste') }}">
  <link rel="apple-touch-icon" href="{{ url_for('icone') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icones/icone-192.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page-connexion">
  <main>
    <img class="logo" src="{{ url_for('static', filename='icones/icone-192.png') }}" alt="" width="72" height="72">
    <h1 class="phrase">Arrosage</h1>
    <p class="detail">Connectez-vous pour piloter le jardin. Vous resterez connecté 30 jours sur cet appareil.</p>
    {% if erreur %}<p class="erreur-connexion" role="alert">{{ erreur }}</p>{% endif %}
    <form method="post">
      <div class="liste">
        <label class="ligne">Identifiant
          <input name="utilisateur" autocomplete="username" autocapitalize="none" autocorrect="off" required value="admin">
        </label>
        <label class="ligne">Mot de passe
          <input name="mot_de_passe" type="password" autocomplete="current-password" required autofocus>
        </label>
      </div>
      <button class="bouton principal">Se connecter</button>
    </form>
  </main>
</body>
</html>
